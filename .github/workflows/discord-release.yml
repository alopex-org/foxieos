# Announces each published GitHub release in the Alopex Discord's
# announcements channel (CONTRIBUTING.md, "Before you start").
# The webhook URL is the repository secret DISCORD_WEBHOOK_RELEASES, which
# only the maintainer sets; without it the job skips. Anyone who has the URL
# can post in the channel, so it never appears in a file or a log.
# Release events never come from forks, so the secret isn't exposed to them.
# It uses no third-party actions, and the release fields reach the script
# through the environment, never pasted into it.
name: Discord release announcement

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  announce:
    name: Announce
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Post the release to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_RELEASES }}
          NAME: ${{ github.event.release.name }}
          TAG: ${{ github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          if [[ -z $WEBHOOK ]]; then
            echo "::notice::The DISCORD_WEBHOOK_RELEASES secret isn't set, so no announcement was posted."
            exit 0
          fi
          kind="release"
          if [[ $PRERELEASE == true ]]; then
            kind="pre-release"
          fi
          # allowed_mentions stops a release name from pinging @everyone or a role.
          payload=$(jq -n --arg name "${NAME:-$TAG}" --arg tag "$TAG" --arg url "$URL" --arg kind "$kind" \
            '{content: "New FoxieOS \($kind): **\($name)** (`\($tag)`)\n\($url)", allowed_mentions: {parse: []}}')
          curl --fail-with-body --silent --show-error --max-time 30 \
            -H 'Content-Type: application/json' -d "$payload" "$WEBHOOK"
