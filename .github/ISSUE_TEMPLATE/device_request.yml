name: Device request
description: Ask for a device or board to be supported. Read the rules for adding a device first.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        FoxieOS supports the Alopex cyber-deck and the Raspberry Pi boards it is built around.
        A device is added only if it meets every one of the [rules for adding a device](https://github.com/alopex-org/foxieos/blob/main/docs/DEVICES.md#rules-for-adding-a-device), and someone on the team owns one and will look after it.
        If a question below is unclear, the [glossary](https://github.com/alopex-org/foxieos/blob/main/docs/GLOSSARY.md) explains the words, and "Not sure" is a fine answer.
  - type: input
    id: device
    attributes:
      label: Device or board
      placeholder: "Raspberry Pi Compute Module 5 on the CM5 IO board"
    validations:
      required: true
  - type: dropdown
    id: cyberdeck
    attributes:
      label: Is it the Alopex cyber-deck, or a board it is built around?
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: drivers
    attributes:
      label: Do all its parts have Linux drivers that may be shipped?
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: true
  - type: input
    id: kernel
    attributes:
      label: Kernel
      placeholder: "Raspberry Pi kernel 6.12"
  - type: dropdown
    id: maintainer
    attributes:
      label: Will you maintain it?
      options:
        - Yes, I own one and will maintain it
        - I own one but can't maintain it
        - "No"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
