name: Bug report
description: Something in a FoxieOS build doesn't work.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Don't report security problems here. Follow the [security policy](https://github.com/alopex-org/foxieos/blob/main/SECURITY.md) instead.
        FoxieOS has no public releases yet, so reports come from development builds.
  - type: input
    id: build
    attributes:
      label: FoxieOS version and build
      description: Where FoxieOS shows its version and build number.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device or board
      placeholder: "Alopex cyber-deck, the development board (name it), or a virtual machine"
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: Update channel
      options:
        - testing
        - beta
        - stable
        - local or development build
    validations:
      required: true
  - type: dropdown
    id: upstream
    attributes:
      label: Does the plain base system have the same problem?
      description: Problems that the base system or another upstream project has too are reported there first. "Not checked" is a fine answer.
      options:
        - Not checked
        - Yes, the base system has it too
        - No, only FoxieOS
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Logs from the device, if you have them. Remove personal data first.
      render: shell
